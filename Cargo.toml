[package]
name = "nelnet-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Command-line access to the Nelnet federal student-loan servicing portal: balances, accrued interest, payment history, and 1098-E tax documents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/nelnet-cli"
authors = ["piekstra"]
publish = false

# The lib exists so integration tests can call the parsers directly, without
# going through the binary or the network.
[lib]
name = "nlnt"
path = "src/lib.rs"

[[bin]]
name = "nlnt"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.9.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.9.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.9.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.9.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.9.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.9.0" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.9.0" }
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.9.0" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
