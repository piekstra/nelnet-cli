[package]
name = "nelnet-cli"
version = "0.4.0"
edition = "2021"
# pk-cli-auth (cli-common v0.21.0) needs 1.89.
rust-version = "1.89"
description = "Command-line access to the Nelnet federal student-loan servicing portal: balances, accrued interest, payment history, and 1098-E tax documents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/nelnet-cli"
authors = ["piekstra"]
publish = false

# The lib exists so integration tests can call the parsers directly, without
# going through the binary or the network.
[lib]
name = "nlnt"
path = "src/lib.rs"

[[bin]]
name = "nlnt"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0", features = ["stdio", "http"] }
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# The `forget_profile_in` seam `src/main.rs`'s logout tests use on a temp dir.
# Same tag as the dependency, so both name one crate; a dev-dependency only, so
# the release binary is built without it.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0", features = ["test-util"] }

# `conformance`, the checks every family MCP server is held to.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0", features = ["test-util"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
